<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stride Log</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f0f0f;
        color: #fafafa;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.5;
        color: #a1a1a1;
        font-size: 0.95rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        background: #f97316;
        color: #0f0f0f;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        border-radius: 0.9rem;
        background: #f97316;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #0f0f0f;
        font-size: 1.4rem;
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">S</div>
    <h1>You&apos;re offline</h1>
    <p>Stride Log needs a connection to sync your training. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
